# =============================================================================
# Framework workbench: Open Terminal + Open WebUI + JupyterLab (nursery) + ChromaDB
#
# NETWORK POSTURE (2026-09-17, user decision "C"): the iptables lockdown is
# GONE — no NET_ADMIN caps, no cage, on any service. Rationale: the framework
# is the scope-lined gateway to the outside world (check_scope / .scope files /
# RoE headers enforce program scope in-process), and the only consumer the
# cage ever actually restricted was the secretary chat loop. The cage also
# collided with the workbench topology: the gateway+brain run INSIDE the
# open-terminal container, so LOCKDOWN_NETWORK caged the framework's own
# target lanes (inspect_host, amass, ZAP, nmap vs real hosts) along with the
# shell. Scope discipline is now purely the in-process layer + operator RoE.
#
# open-terminal bind-mounts the live production tree (no COPY) and hosts the
# framework gateway (:6000) + Brain sidecar; its shell is the agent runtime.
#
# JupyterLab (the tool nursery) shares the live framework tree and reaches the
# gateway on the workbench subnet; with the cage gone it can also be proxied
# for remote access. JUPYTER_TOKEN-gated and bound to the host's
# JupyterLab port on all interfaces (operator choice, reaches the lab lanes).
#
# Open WebUI is the open chat frontend: it does its own web search and calls
# the framework's API routes for tool/code execution.
#
# ChromaDB is defined below as the `chroma` service — it mirrors the previous
# standalone `chroma` container (same image, same config.yaml, same `chroma-data`
# bind mount, host port 9000).  open-terminal reaches it by DNS name `chroma`
# on the workbench network.  See the note above the service block about removing
# the standalone container first.
#
# Usage:
#   cd dockered
#   ./up.sh                  # builds + starts (removes legacy chroma first)
#
#   # or manually:
#   docker rm -f chroma       # clear the standalone container if present
#   docker compose up -d --build
#
# Open Terminal API:  http://localhost:8000   (connect Open WebUI here)
# Framework gateway:  http://localhost:6000   (REST + MCP, from host)
# Open WebUI:         http://localhost:3000   (chat front end)
# JupyterLab:         http://localhost:8888   (dev/automation IDE, localhost-only)
#
# open-terminal now bind-mounts the live production tree (..) at /opt/framework
# instead of baking a COPY, so code edits on the host are picked up with no
# rebuild. Note: .dockerignore does NOT apply to bind mounts — .git/ and any
# non-ignored host files become visible inside the container.
#
# Override API keys / tokens via shell env or a dockered/.env file:
#   OPEN_TERMINAL_API_KEY=your-key
#   GATEWAY_API_KEY=your-key
#   JUPYTER_TOKEN=your-token
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # ChromaDB — mirrored from the existing standalone `chroma` container so the
  # workbench is self-contained.  Service name `chroma` is the DNS name on the
  # workbench network, matching CHROMA_HOST=chroma in framework.env.
  #
  # Before `docker compose up`, stop/remove the standalone container to avoid a
  # host port-9000 / container-name collision:
  #   docker rm -f chroma
  # ─────────────────────────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma
    command: [ "run", "/config.yaml" ]
    ports:
      - "9000:8000" # host 9000 -> container 8000 (matches existing mapping)
    networks:
      workbench:
        ipv4_address: 172.28.0.10
    volumes:
      - ../chroma-data:/data # reuse the existing on-disk vector store
      - ./chroma-config.yaml:/config.yaml:ro
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Open WebUI — chat front end layered over the framework.
  # Reaches open-terminal at open-terminal:8000 (tools) and Ollama directly at
  # 10.10.10.128:11434 (LLM, host lane enp92s0 — the lab-switch lane is routed
  # and SNATed downwind, so containers reach it through the host). Not behind
  # the open-terminal firewall — this is the open dev surface, not the gated
  # agent surface.
  # ─────────────────────────────────────────────────────────────────────────
  open-webui:
    # NOTE: pinned to :dev (not :main) because the interactive terminal shell
    # is broken in the current stable release v0.11.3. Open WebUI's WebSocket
    # proxy omits the X-User-Id / X-Session-Id headers that open-terminal's
    # attach handler checks, so every interactive PTY attach is closed with
    # 4004 "Session not found" (REST/file-browser/AI tool calls still work).
    # Fixed in dev: see open-webui/open-webui#29787. Switch back to :main once
    # a stable release newer than v0.11.3 ships (0.11.4+).
    image: ghcr.io/open-webui/open-webui:dev
    ports:
      - "3000:8080"
    networks:
      workbench:
        ipv4_address: 172.28.0.30
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://192.168.56.1:11434
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
      - WEBUI_URL_PREFIX=${WEBUI_URL_PREFIX}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Reduce memory pressure: disable the built-in sentence-transformers
      # embedding model (loads ~500MB into RAM on every boot and grows from
      # there). RAG will fall back to Ollama's embedding API instead.
      - RAG_EMBEDDING_ENGINE=ollama
      # Limit the embedding batch size to avoid memory spikes during RAG.
      - RAG_EMBEDDING_BATCH_SIZE=50
    # Memory limit: the OOM kernel killer was shooting this container's
    # python3 process after it ballooned to ~17GB RSS. A Docker-level limit
    # makes the restart deterministic (Docker OOM-kills the container, which
    # then restarts via unless-stopped) instead of the kernel taking out a
    # random victim and destabilizing the host. 4GB is generous for the
    # chat frontend; adjust up if RAG workloads need more headroom.
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # JupyterLab — notebook/code-execution workbench.
  #
  # This is intentionally a separate lane from open-terminal. The live
  # framework tree is mounted so the daharness kernelspec and gateway wiring
  # can be configured manually while experimenting with Open WebUI's code
  # execution integration.
  # ─────────────────────────────────────────────────────────────────────────
  jupyter:
    build:
      context: ..
      dockerfile: dockered/jupyter.Dockerfile
    ports:
      - "8888:8888" # published on all host interfaces (operator choice — reaches the lab lanes)
    networks:
      workbench:
        ipv4_address: 172.28.0.40
      # Second adapter for general egress (pip installs, extension-registry
      # queries). The workbench bridge stays the framework lane; this one
      # gives the notebook service normal NAT'd outbound access. Attached
      # after workbench, so it wins the default route — 172.28.0.0/24 still
      # routes via the workbench interface for framework traffic.
      egress:
    # DNS: kali-side dnsmasq at the pinned workbench bridge gateway (ipam:
    # 172.28.0.0/24). It serves kali's /etc/hosts lab entries so notebook
    # resolution matches the host; Docker's embedded resolver (127.0.0.11)
    # still stays in charge of container names on the workbench network.
    # dnsmasq config: kali's /etc/dnsmasq.d/lab.conf — reprovisioned by
    # dockered/lab-dns-setup.sh (idempotent; also writes the
    # After=docker.service systemd drop-in). Design notes: knowledge/lab-dns.md.
    dns:
      - 172.28.0.1
    volumes:
      - /home/kali/github/daharness:/home/jovyan/framework
      - /home/kali/github/daharness/dabooks:/home/jovyan/work       # notebooks — on host, git init here for version control
      - /home/kali/jupyter-home/.ipython:/home/jovyan/.ipython   # IPython history survives recreates

      # Persist notebook-intelligence settings + the stored GitHub token so
      # image rebuilds don't wipe the Copilot login. Contains credentials —
      # gitignored as dockered/jupyter-nbi/.
      - ./jupyter-nbi:/home/jovyan/.jupyter/nbi

      # Env-level NBI config baked by the Dockerfile, bind-mounted read-only:
      # NBI layers the env-prefix file under the user file, so this is the
      # rebuild-proof baseline for settings the Settings UI never re-persists
      # (notably chatbook_backend_kernel — without it Chatbook code runs on
      # python3 and loses the framework-tool stubs + rules).
      - ./jupyter-nbi-config.json:/opt/conda/share/jupyter/nbi/config.json:ro

      # pyrightconfig for the jupyterlab-lsp pyright lane: NOT mounted — work/
      # is a host bind-mount and the image cannot bake into it. The before-
      # notebook.d hook (10-refresh-stubs.sh) copies the baked config from
      # /opt/conda/share/jupyter/pyrightconfig.d/ on every boot (only if the
      # operator hasn't pinned their own). Keep dockered/jupyter.Dockerfile's
      # baked heredoc and stubPath in sync if editing by hand.
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - FRAMEWORK_GATEWAY_URL=http://open-terminal:6000
      - JUPYTER_MAPPINGKERNELMANAGER_DEFAULT_KERNEL_NAME=daharness
      # notebook-intelligence's native Ollama provider (and the `ollama` SDK
      # it drives) default to localhost:11434, but Ollama runs on the host
      # lab lane — same address the open-webui service uses for its LLM.
      - OLLAMA_HOST=http://192.168.56.1:11434
    command:
      - start-notebook.py
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.allow_root=False
      - --ServerApp.token=${JUPYTER_TOKEN}
      - --ServerApp.root_dir=/home/jovyan/work
      - --MappingKernelManager.default_kernel_name=daharness
    # Override the base image's 1s health-check timeout — the stock
    # docker_healthcheck.py spawns a Python process that imports Jupyter
    # modules and hits the server API, which takes ~6s on this image
    # (notebook-intelligence + MCP server + 17 tool registrations all boot
    # before the API is responsive). 1s guaranteed a permanent "unhealthy"
    # label that never reflected a real failure.
    healthcheck:
      test: ["CMD", "/etc/jupyter/docker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped


volumes:
  open-webui-data:


networks:
  workbench:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  egress:
    driver: bridge
