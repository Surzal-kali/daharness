# =============================================================================
# Framework workbench: ChromaDB + Open WebUI + JupyterLab (tool nursery)
#
# NETWORK POSTURE (2026-09-17, user decision "C"): the iptables lockdown is
# GONE — no NET_ADMIN caps, no cage, on any service. Rationale: the framework
# is the scope-lined gateway to the outside world (check_scope / .scope files /
# RoE headers enforce program scope in-process), and the only consumer the
# cage ever actually restricted was the secretary chat loop. The cage also
# collided with the workbench topology: the gateway+brain used to run INSIDE
# the (now-removed) open-terminal container, so LOCKDOWN_NETWORK caged the framework's own
# target lanes (inspect_host, amass, ZAP, nmap vs real hosts) along with the
# shell. Scope discipline is now purely the in-process layer + operator RoE.
#
# The framework gateway + Brain sidecar no longer run inside this stack (the
# old open-terminal service was removed) — run them on the host via
# bootstrap.py / bootstrap.py --daemon; see dockered/README.md.
#
# JupyterLab (the tool nursery) bind-mounts the live framework tree and the
# dabooks work dir; its daharness kernel drives the same tool lane as the
# Brain sidecar and tool_repl, reaching the Brain through the shared
# run/brain.sock inside the bind-mounted tree. JUPYTER_TOKEN-gated and
# bound to the host's JupyterLab port on all interfaces (operator choice,
# reaches the lab lanes).
#
# Open WebUI is the open chat frontend: it does its own web search and calls
# the framework's API routes for tool/code execution.
#
# ChromaDB is defined below as the `chroma` service — it mirrors the previous
# standalone `chroma` container (same image, same config.yaml, same `chroma-data`
# bind mount, host port 9000).  jupyter and open-webui reach it by DNS name
# `chroma` on the workbench network.  See the note above the service block
# about removing the standalone container first.
#
# Usage:
#   cd dockered
#   docker rm -f chroma      # clear the standalone container if present
#   docker compose up -d --build        # full service map: dockered/README.md
#
# ChromaDB:    http://localhost:9000      (vector registry, reused volume)
# Open WebUI:  http://localhost:3000      (chat front end)
# JupyterLab:  http://localhost:8888      (tool nursery, JUPYTER_TOKEN)
# code-server: https://localhost:8443     (browser editor, CODE_SERVER_PASSWORD)
# Framework gateway + Brain: run on the HOST lane (bootstrap.py; gateway :5000)
#
# Both jupyter and (previously) open-terminal bind-mount the live production
# tree instead of baking a COPY, so code edits on the host are picked up with
# no rebuild. Note: .dockerignore does NOT apply to bind mounts — .git/ and
# any non-ignored host files become visible inside the containers.
#
# Override API keys / tokens via shell env or a dockered/.env file:
#   OPEN_TERMINAL_API_KEY=your-key
#   GATEWAY_API_KEY=your-key
#   JUPYTER_TOKEN=your-token
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # ChromaDB — mirrored from the existing standalone `chroma` container so the
  # workbench is self-contained.  Service name `chroma` is the DNS name on the
  # workbench network, matching CHROMA_HOST=chroma in framework.env.
  #
  # Before `docker compose up`, stop/remove the standalone container to avoid a
  # host port-9000 / container-name collision:
  #   docker rm -f chroma
  # ─────────────────────────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma
    command: [ "run", "/config.yaml" ]
    ports:
      - "9000:8000" # host 9000 -> container 8000 (matches existing mapping)
    networks:
      workbench:
        ipv4_address: 172.28.0.10
    volumes:
      - ../chroma-data:/data # reuse the existing on-disk vector store
      - ./chroma-config.yaml:/config.yaml:ro
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Open WebUI — chat front end layered over the framework.
  # Talks to Ollama directly at 10.10.10.128:11434 (LLM, host lane enp92s0 —
  # the lab-switch lane is routed and SNATed downwind, so containers reach it
  # through the host); framework tool calls go through the owui-tools
  # wrappers (gateway_url valve — see dockered/README.md). This is the open
  # dev surface, not the gated agent surface.
  # ─────────────────────────────────────────────────────────────────────────
  open-webui:
    # NOTE: pinned to :dev (not :main) because the interactive terminal shell
    # is broken in the current stable release v0.11.3 — Open WebUI's WebSocket
    # proxy omits the X-User-Id / X-Session-Id headers its attach handler
    # checks, so every interactive PTY attach is closed with 4004 "Session
    # not found" (REST/file-browser/AI tool calls still work). Fixed in dev:
    # see open-webui/open-webui#29787. Switch back to :main once a stable
    # release newer than v0.11.3 ships (0.11.4+).
    image: ghcr.io/open-webui/open-webui:dev
    ports:
      - "3000:8080"
    networks:
      workbench:
        ipv4_address: 172.28.0.30
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://192.168.56.1:11434
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
      - WEBUI_URL_PREFIX=${WEBUI_URL_PREFIX}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Reduce memory pressure: disable the built-in sentence-transformers
      # embedding model (loads ~500MB into RAM on every boot and grows from
      # there). RAG will fall back to Ollama's embedding API instead.
      - RAG_EMBEDDING_ENGINE=ollama
      # Limit the embedding batch size to avoid memory spikes during RAG.
      - RAG_EMBEDDING_BATCH_SIZE=50
    # Memory limit: the OOM kernel killer was shooting this container's
    # python3 process after it ballooned to ~17GB RSS. A Docker-level limit
    # makes the restart deterministic (Docker OOM-kills the container, which
    # then restarts via unless-stopped) instead of the kernel taking out a
    # random victim and destabilizing the host. 4GB is generous for the
    # chat frontend; adjust up if RAG workloads need more headroom.
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # JupyterLab — notebook/code-execution workbench.
  #
  # This is intentionally a separate lane from the host lane where the
  # framework gateway + Brain run. The live
  # framework tree is mounted so the daharness kernelspec and gateway wiring
  # can be configured manually while experimenting with Open WebUI's code
  # execution integration.
  # ─────────────────────────────────────────────────────────────────────────
  jupyter:
    build:
      context: ..
      dockerfile: dockered/jupyter.Dockerfile
    ports:
      - "8888:8888" # published on all host interfaces (operator choice — reaches the lab lanes)
    networks:
      workbench:
        ipv4_address: 172.28.0.40
      # Second adapter for general egress (pip installs, extension-registry
      # queries). The workbench bridge stays the framework lane; this one
      # gives the notebook service normal NAT'd outbound access. Attached
      # after workbench, so it wins the default route — 172.28.0.0/24 still
      # routes via the workbench interface for framework traffic.
      egress:
    # DNS: kali-side dnsmasq at the pinned workbench bridge gateway (ipam:
    # 172.28.0.0/24). It serves kali's /etc/hosts lab entries so notebook
    # resolution matches the host; Docker's embedded resolver (127.0.0.11)
    # still stays in charge of container names on the workbench network.
    # dnsmasq config: kali's /etc/dnsmasq.d/lab.conf — reprovisioned by
    # dockered/lab-dns-setup.sh (idempotent; also writes the
    # After=docker.service systemd drop-in). Design notes: knowledge/lab-dns.md.
    dns:
      - 172.28.0.1
    volumes:
      - /home/kali/github/daharness:/home/jovyan/framework
      - /home/kali/github/daharness/dabooks:/home/jovyan/work       # notebooks — on host, git init here for version control
      - /home/kali/jupyter-home/.ipython:/home/jovyan/.ipython   # IPython history survives recreates

      # Persist notebook-intelligence settings + the stored GitHub token so
      # image rebuilds don't wipe the Copilot login. Contains credentials —
      # gitignored as dockered/jupyter-nbi/.
      - ./jupyter-nbi:/home/jovyan/.jupyter/nbi

      # Env-level NBI config baked by the Dockerfile, bind-mounted read-only:
      # NBI layers the env-prefix file under the user file, so this is the
      # rebuild-proof baseline for settings the Settings UI never re-persists
      # (notably chatbook_backend_kernel — without it Chatbook code runs on
      # python3 and loses the framework-tool stubs + rules).
      - ./jupyter-nbi-config.json:/opt/conda/share/jupyter/nbi/config.json:ro

      # pyrightconfig for the jupyterlab-lsp pyright lane: NOT mounted — work/
      # is a host bind-mount and the image cannot bake into it. The before-
      # notebook.d hook (10-refresh-stubs.sh) copies the baked config from
      # /opt/conda/share/jupyter/pyrightconfig.d/ on every boot (only if the
      # operator hasn't pinned their own). Keep dockered/jupyter.Dockerfile's
      # baked heredoc and stubPath in sync if editing by hand.
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - FRAMEWORK_GATEWAY_URL=http://open-terminal:6000
      - JUPYTER_MAPPINGKERNELMANAGER_DEFAULT_KERNEL_NAME=daharness
      # notebook-intelligence's native Ollama provider (and the `ollama` SDK
      # it drives) default to localhost:11434, but Ollama runs on the host
      # lab lane — same address the open-webui service uses for its LLM.
      - OLLAMA_HOST=http://192.168.56.1:11434
    command:
      - start-notebook.py
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.allow_root=False
      - --ServerApp.token=${JUPYTER_TOKEN}
      - --ServerApp.root_dir=/home/jovyan/work
      - --MappingKernelManager.default_kernel_name=daharness
    # Override the base image's 1s health-check timeout — the stock
    # docker_healthcheck.py spawns a Python process that imports Jupyter
    # modules and hits the server API, which takes ~6s on this image
    # (notebook-intelligence + MCP server + 17 tool registrations all boot
    # before the API is responsive). 1s guaranteed a permanent "unhealthy"
    # label that never reflected a real failure.
    healthcheck:
      test: ["CMD", "/etc/jupyter/docker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # code-server — self-hosted browser editor (LAN-only; no tunnel, no third
  # party in the trust path).
  #
  # Assistant policy: NO Microsoft-gallery side-loading, NO Copilot VSIX —
  # the marketplace-ToU gray zone stays out. Pure-local lane instead:
  # OpenVSX-only extensions (python, jupyter, basedpyright, clangd) installed
  # idempotently at boot by the mounted init script, and continue.continue
  # pointed at the host-lane Ollama for inline completions + chat
  # (config provisioned on first boot only, then operator-owned — never
  # overwritten by later boots).
  #
  # The live framework tree is mounted (same discipline as jupyter) so
  # run/brain.sock is reachable from the editor's terminal lane and code
  # edits on the host need no rebuild. It mounts at /config/workspace — the
  # lsio image's default workspace path, which its boot-time chown prunes.
  #
  # Auth: PASSWORD comes from CODE_SERVER_PASSWORD in dockered/.env
  # (gitignored). Compose fails up when unset — the editor shell has full
  # repo access, do not run it open.
  # ─────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────
  # Runtime lane (dockered/code-server.Dockerfile): the stock lsio editor
  # image (lscr.io/linuxserver/code-server:latest) plus a baked framework
  # venv (/opt/framework-venv — pinned dep set, same discipline as the
  # jupyter image), build-time stubs (/opt/framework-stubs), the daharness
  # kernelspec, and python/pip/jupyter on PATH — the editor terminal can
  # actually import + run the framework, not just read it. The boot hook
  # (code-server-init/10-framework-runtime.sh) refreshes stubs from the live
  # tree and provisions editor settings (interpreter, stubPath) into the
  # persistent volume.
  code-server:
    build:
      context: ..
      dockerfile: dockered/code-server.Dockerfile
    ports:
      - "8443:8443" # container serves HTTPS with a self-signed cert
    networks:
      workbench:
        ipv4_address: 172.28.0.50
      # Dedicated free egress lane: plain NAT bridge, nothing else attached.
      # The editor is the operator's full dev workbench (marketplace, git,
      # language servers) and should not share or depend on the shared
      # `egress` adapter. Attached after workbench so it wins the default
      # route — 172.28.0.0/24 still routes via the workbench interface.
      devnet:
    dns:
      - 172.28.0.1
    environment:
      - PUID=1000 # kali host UID — same-uid access to the bind-mounted tree
      - PGID=1000
      - PASSWORD=${CODE_SERVER_PASSWORD:?set CODE_SERVER_PASSWORD in dockered/.env}
      - OLLAMA_BASE_URL=http://192.168.56.1:11434 # read by the init script when provisioning Continue
      - DEFAULT_WORKSPACE=/config/workspace # editor boots opened on the framework tree
      # TLS IP-SANs for the LAN addresses the editor is browsed on — webview
      # service workers die with a localhost-only cert (see README).
      - CODE_SERVER_CERT_SANS=IP:10.0.0.42,IP:192.168.56.108
    volumes:
      - code-server-config:/config # extensions, settings, history
      - /home/kali/github/daharness:/config/workspace # live tree; lsio prunes this path from its boot chown → run/brain.sock reachable
      - ./code-server-init/00-extensions-and-continue.sh:/custom-cont-init.d/00-extensions-and-continue.sh:ro
      - ./code-server-init/10-framework-runtime.sh:/custom-cont-init.d/10-framework-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8443' || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 300s # first boot provisions extensions before the server starts
      retries: 3
    restart: unless-stopped


volumes:
  open-webui-data:
  code-server-config:


networks:
  workbench:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  egress:
    driver: bridge
  devnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
